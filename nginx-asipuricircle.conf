server {
    listen 80;
    server_name asipuricircle.in www.asipuricircle.in;
    
    # Path where the built React/Vite app will live on your server
    root /var/www/asipuricircle.in/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com; object-src 'none'; base-uri 'self';" always;

    # Handle React Router SPA (redirect 404s to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, fonts, css, js) for 6 months
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Deny access to hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
    }
}
