server {
    listen 80;
    server_name asipuricircle.in www.asipuricircle.in;
    
    # Path where the built React/Vite app will live on your server
    root /var/www/asipuricircle.in/html;
    index index.html;

    # Handle React Router SPA (redirect 404s to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, fonts, css, js) for 6 months
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Deny access to hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
    }
}
